<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Florify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --cream:#ECE2D0;
  --card:#FFFDF8;
  --card-alt:#FBF6EC;
  --column:#F6EDE0;
  --line:#E0D2BE;
  --line-soft:#F0E5D5;
  --ink:#3B2B2F;
  --ink-soft:#6B5B55;
  --rose:#A26769;
  --rose-soft:#B0A197;
  --burgundy:#6D2E46;
  --burgundy-hover:#5A2439;
  --amber:#F2A65A;
  --amber-hover:#E8964A;
  --amber-ink:#4A2418;
}
*{box-sizing:border-box}
html{background:var(--cream)}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:'Golos Text',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Manrope',system-ui,sans-serif;margin:0}
a{color:var(--burgundy)}
a:hover{color:var(--rose)}
input,select,textarea,button{font-family:inherit;font-size:14px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--amber);outline-offset:2px;
}
::selection{background:color-mix(in srgb, var(--burgundy) 25%, transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important;transition:none !important}
}

.shell{min-height:100vh;padding:28px 32px 72px;max-width:1400px;margin:0 auto}

/* ---------- header ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand h1{font-weight:800;font-size:44px;letter-spacing:-0.03em;color:var(--burgundy)}
.brand p{margin:6px 0 0;font-size:14px;color:var(--rose)}
.demo-pill{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:8px 16px;box-shadow:0 2px 10px rgba(109,46,70,.08);font-size:13px;color:var(--burgundy);white-space:nowrap}
.demo-dot{width:9px;height:9px;border-radius:50%;background:#2f6d5d;flex:none}
.user-bar{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--rose)}
.user-bar[hidden]{display:none}

/* ---------- login ---------- */
.login-card{max-width:400px;margin:40px auto 0}
.login-card h2{margin-bottom:6px}
.login-card form{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.login-error{margin:0;font-size:13px;color:#a8342f}

/* ---------- tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.tab-btn{
  border:none;cursor:pointer;font-size:14.5px;font-weight:600;font-family:'Manrope',sans-serif;
  padding:11px 20px;border-radius:999px;transition:background .15s,color .15s,box-shadow .15s;
  background:var(--card);color:var(--rose);
}
.tab-btn.active{background:var(--burgundy);color:#FFF7EC;box-shadow:0 4px 14px rgba(109,46,70,.25)}
.tab-btn:not(.active):hover{background:#F6EDE0}

/* ---------- generic surfaces ---------- */
.panel-stack{display:flex;flex-direction:column;gap:24px}
.card-surface{background:var(--card);border-radius:24px;padding:22px 24px;box-shadow:0 6px 24px rgba(109,46,70,.09)}
.card-surface h2{font-weight:600;font-size:19px;color:var(--burgundy)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.section-head .hint{font-size:12.5px;color:var(--rose)}

/* ---------- capture card ---------- */
.chat-input{
  width:100%;border:1px solid var(--line);background:var(--card-alt);border-radius:16px;
  padding:14px 16px;font-size:14.5px;line-height:1.5;color:var(--ink);resize:vertical;
}
.capture-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px}
.btn-recognize{
  border:none;border-radius:999px;padding:12px 26px;font-size:14.5px;font-weight:600;
  font-family:'Manrope',sans-serif;cursor:pointer;background:var(--amber);color:var(--amber-ink);
  box-shadow:0 4px 14px rgba(242,166,90,.35);transition:background .15s;
}
.btn-recognize:hover{background:var(--amber-hover)}
.btn-recognize[disabled]{background:#E8D9C3;color:#9A8A80;cursor:default;box-shadow:none}
.spinner{width:16px;height:16px;border:2px solid var(--amber);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}
.recognize-hint{font-size:12.5px;color:var(--rose)}

.recognized{margin-top:20px;padding-top:20px;border-top:1px dashed var(--line);animation:pop .25s ease both}
.recognized-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.recognized-flag{background:var(--amber);color:var(--amber-ink);font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--rose)}
.field input,.field select{
  border:1px solid var(--line);background:var(--card-alt);border-radius:12px;padding:11px 13px;
  font-size:14px;color:var(--ink);width:100%;
}
.form-actions{display:flex;gap:10px;margin-top:16px}
.btn-primary{background:var(--burgundy);color:#FFF7EC;border:none;border-radius:999px;padding:12px 24px;font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(109,46,70,.25);font-family:'Manrope',sans-serif;transition:background .15s}
.btn-primary:hover{background:var(--burgundy-hover)}
.btn-cancel{background:transparent;color:var(--rose);border:1px solid var(--line);border-radius:999px;padding:12px 20px;font-size:14.5px;cursor:pointer;transition:background .15s}
.btn-cancel:hover{background:#F6EDE0}

/* ---------- kanban ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;align-items:start}
.column{background:var(--column);border-radius:22px;padding:16px;border:1px solid transparent;min-height:200px;transition:border-color .15s}
.column.drag-over{border-color:var(--col-accent)}
.column-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.col-dot{width:9px;height:9px;border-radius:50%;background:var(--col-accent);flex:none}
.column-head h3{font-weight:600;font-size:14.5px;color:var(--burgundy);min-width:0;overflow-wrap:break-word}
.col-count{margin-left:auto;font-size:12px;color:var(--rose);background:#F0E5D5;border-radius:999px;padding:2px 9px}
.col-body{display:flex;flex-direction:column;gap:12px;min-height:80px}
.kcard{
  background:var(--card);border-radius:18px;padding:15px;border:1px solid var(--line-soft);
  box-shadow:0 2px 10px rgba(109,46,70,.07);cursor:grab;
}
.kcard.dragging{opacity:.4}
.kcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.kcard-bouquet{margin:0;font-family:'Manrope',sans-serif;font-weight:600;font-size:14.5px;line-height:1.35;color:var(--ink)}
.channel-badge{flex:none;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.channel-badge.wa{background:#DDF0E4;color:#1F6B45}
.channel-badge.ig{background:#FAE0EC;color:#9B2C6B}
.kcard-price{margin:10px 0 0;font-family:'Manrope',sans-serif;font-weight:800;font-size:19px;color:var(--burgundy)}
.kcard-meta{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:12.5px}
.muted{color:var(--rose-soft);font-size:12px}
.filled{color:var(--ink-soft)}
.kcard-client{display:flex;align-items:center;gap:7px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft)}
.avatar{width:22px;height:22px;border-radius:50%;background:#F6EDE0;color:var(--rose);font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.client-name{font-size:13px;color:var(--ink)}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
thead th{text-align:left;padding:10px 12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--rose);border-bottom:1px solid var(--line-soft);white-space:nowrap}
th.num,td.num{text-align:right;white-space:nowrap}
tbody td{padding:14px 12px;border-bottom:1px solid #F4EADB}
.orders-count{font-family:'Manrope',sans-serif;font-weight:600;color:var(--burgundy)}
.phone-col{color:var(--ink-soft)}

.panel-head-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.add-form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--card-alt);border-radius:16px;padding:16px;margin-bottom:18px;animation:pop .2s ease both}
.add-form .field input{background:var(--card);min-width:200px}
.btn-save{background:var(--amber);color:var(--amber-ink);border:none;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Manrope',sans-serif;transition:background .15s}
.btn-save:hover{background:var(--amber-hover)}

/* ---------- stock ---------- */
.stock-name{display:inline-flex;align-items:center;gap:9px}
.low-badge{background:var(--amber);color:var(--amber-ink);font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:999px}
tr.low-row{background:#FDF3E3}
.qty-cell{font-family:'Manrope',sans-serif;font-weight:600;color:var(--ink)}
.qty-btns{display:flex;gap:8px;justify-content:flex-end}
.qty-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card-alt);color:var(--burgundy);font-size:17px;line-height:1;cursor:pointer;transition:background .15s}
.qty-btn:hover{background:#F2E4D2}

/* ---------- writeoffs ---------- */
.wo-form{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.wo-form .field select,.wo-form .field input{min-width:180px}
.wo-form .field.qty input{width:120px;min-width:0}
.reason-tag{background:#F6EDE0;color:#8A5A4E;border-radius:999px;padding:3px 11px;font-size:12.5px;white-space:nowrap}
.wo-qty{font-family:'Manrope',sans-serif;font-weight:600;color:var(--burgundy)}

/* ---------- summary ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
#analytics .stat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat-card{background:var(--card);border-radius:24px;padding:26px;box-shadow:0 6px 24px rgba(109,46,70,.09)}
.stat-label{margin:0;font-size:13px;color:var(--rose)}
.stat-value{margin:10px 0 0;font-family:'Manrope',sans-serif;font-weight:800;font-size:34px;line-height:1.1;letter-spacing:-0.03em;color:var(--burgundy)}
.stat-note{margin:8px 0 0;font-size:12.5px;color:#8A7A72}

/* ---------- board toolbar, card actions ---------- */
.board-toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.pill-group{display:inline-flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 2px 10px rgba(109,46,70,.06)}
.pill{border:none;background:transparent;color:var(--rose);font-weight:600;font-size:13.5px;padding:8px 16px;border-radius:999px;cursor:pointer;font-family:'Manrope',sans-serif}
.pill.active{background:var(--burgundy);color:#FFF7EC}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);cursor:pointer}
.btn-link{border:none;background:none;color:var(--burgundy);text-decoration:underline;cursor:pointer;padding:4px;font-size:13px}
.col-empty{margin:4px 2px;font-size:12.5px;color:var(--rose-soft)}
.kcard.cancelled{opacity:.6}
.kcard.cancelled .kcard-bouquet{text-decoration:line-through}
.kcard-phone{margin-left:auto;font-size:12px;color:var(--ink-soft);text-decoration:none;white-space:nowrap}
.kcard-actions{display:flex;gap:8px;margin-top:12px}
.btn-step{flex:1;border:none;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Manrope',sans-serif;background:#F6EDE0;color:var(--burgundy);transition:background .15s}
.btn-step:hover{background:#EEDFCB}
.btn-icon{width:36px;height:36px;flex:none;border:1px solid var(--line);border-radius:50%;background:var(--card-alt);color:var(--burgundy);cursor:pointer;font-size:15px}
.late-badge{display:inline-block;background:#F9E1DE;color:#8E2A22;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:4px}
.field.wide{grid-column:1/-1}
.field-note{grid-column:1/-1;margin:-6px 0 0;font-size:12.5px;color:var(--ink-soft)}
.btn-danger{background:transparent;color:#a8342f;border:1px solid #E7C3BE;border-radius:999px;padding:12px 20px;font-size:14.5px;cursor:pointer}
.btn-danger.armed{background:#a8342f;color:#fff;border-color:#a8342f}
.price-input{width:96px;text-align:right;border:1px solid var(--line);background:var(--card-alt);border-radius:10px;padding:7px 10px;color:var(--ink)}

/* ---------- edit dialog ---------- */
.dialog{border:none;border-radius:24px;padding:0;width:min(720px,calc(100vw - 32px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(59,43,47,.25)}
.dialog::backdrop{background:rgba(59,43,47,.35)}
.dialog-body{padding:22px 24px}
.status-field{margin-top:14px;max-width:260px}
.dialog-actions{flex-wrap:wrap}
.dialog-actions .spacer{flex:1}

/* ---------- analytics ---------- */
#analytics.refreshing{opacity:.55;transition:opacity .15s}
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.chart-card{min-width:0}
.chart-card.wide{grid-column:1/-1}
.chart-head{margin-bottom:16px}
.chart-head .hint{margin:4px 0 0;font-size:12.5px;color:var(--rose)}
.chart-empty{margin:8px 0;font-size:13.5px;color:var(--rose-soft)}
.chart-box{width:100%}
.chart-svg{width:100%;height:auto;display:block}
.chart-svg .grid{stroke:var(--line-soft);stroke-width:1}
.chart-svg .tick{font-size:11px;fill:#8A7A72;font-variant-numeric:tabular-nums}
.chart-svg .peak{font-size:11.5px;font-weight:600;fill:var(--ink)}
.chart-svg .bar{fill:var(--burgundy)}
.chart-svg .hit{fill:transparent}
.chart-svg .hit:hover{fill:rgba(109,46,70,.06)}
.chart-table{margin-top:10px;font-size:13px}
.chart-table summary{cursor:pointer;color:var(--rose)}
.hbars{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.hbar-row{display:grid;grid-template-columns:minmax(90px,34%) 1fr auto;align-items:center;gap:10px;font-size:13px;border-radius:8px;padding:2px 0}
.hbar-row:focus-visible{outline:2px solid var(--amber)}
.hbar-label{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{height:12px;display:flex;align-items:center}
.hbar{display:block;height:12px;background:var(--burgundy);border-radius:0 4px 4px 0}
.hbar-value{color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
table.compare{margin-bottom:16px}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-columns:28px repeat(24,minmax(14px,1fr));gap:2px;min-width:420px}
.heat-hour{font-size:10.5px;color:#8A7A72;text-align:left}
.heat-day{font-size:11.5px;color:var(--ink-soft);align-self:center}
.heat-cell{display:block;height:22px;border-radius:3px;background:color-mix(in srgb,var(--burgundy) var(--lvl),var(--line-soft))}
.heat-legend{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:11.5px;color:#8A7A72}
.heat-legend .heat-cell{width:14px;height:14px}
.chart-tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:#FFF7EC;font-size:12.5px;padding:6px 10px;border-radius:8px;max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.18)}

@media (max-width:640px){
  .shell{padding:20px 16px 56px}
  .brand h1{font-size:34px}
  .dialog-body{padding:18px 16px}
  .stat-value{font-size:22px;white-space:nowrap}
  .stat-card{padding:18px}
}
@media (max-width:900px){
  .chart-grid{grid-template-columns:minmax(0,1fr)}
  #analytics .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>Florify</h1>
      <p>AI-ассистент приёма заказов для цветочного магазина</p>
    </div>
    <div class="user-bar" id="userBar" hidden>
      <span id="userEmail"></span>
      <button type="button" id="logoutBtn" class="btn-cancel">Выйти</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div id="panel"></div>
</div>
<dialog id="orderDialog" class="dialog" aria-label="Заказ"></dialog>
<div id="chartTip" class="chart-tip" role="tooltip" hidden></div>

<script>
(function(){
  "use strict";

  var MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  var WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  var STATUS = {
    new:       { title: 'Новый',           color: '#c9a648', next: 'build',   nextLabel: '→ В сборку' },
    build:     { title: 'В сборке',        color: '#2f5fa8', next: 'courier', nextLabel: '→ Курьеру' },
    courier:   { title: 'Передан курьеру', color: '#7a5ea8', next: 'done',    nextLabel: '✓ Доставлен' },
    done:      { title: 'Доставлен',       color: '#2f6d5d' },
    cancelled: { title: 'Отменён',         color: '#9a8a80' }
  };
  var STATUS_ORDER = ['new','build','courier','done'];
  var DONE_LIMIT = 20;
  var TABS = [['orders','Заказы'],['clients','Клиенты'],['stock','Склад'],['writeoffs','Списания'],['summary','Аналитика']];

  function fmtDate(d){ return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function money(n){ return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₸'; }
  function num(n){ return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  /* дата в местном времени магазина как 'YYYY-MM-DD' */
  function isoDay(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function parseDay(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function hhmm(t){ return t ? String(t).slice(0, 5) : ''; }
  function fmtDuration(min){
    if (min == null) return '—';
    min = Math.round(min);
    if (min < 60) return min + ' мин';
    var h = Math.floor(min / 60), m = min % 60;
    if (h < 24) return h + ' ч' + (m ? ' ' + m + ' мин' : '');
    var d = Math.floor(h / 24);
    return d + ' д ' + (h % 24) + ' ч';
  }
  function pct(a, b){ return b ? Math.round(a / b * 100) + '%' : '—'; }

  /* состав по позициям <-> строка «Роза — 25, Эвкалипт — 5» для ручной правки */
  function itemsToText(items){
    return (items || []).map(function(it){ return it.flower + (it.qty ? ' — ' + it.qty : ''); }).join(', ');
  }
  function textToItems(text){
    return String(text || '').split(/[,;\n]/).map(function(part){
      part = part.trim();
      if (!part) return null;
      var m = part.match(/^(.+?)(?:\s*[—–\-×x:]\s*|\s+)(\d+)\s*(?:шт\.?)?$/i);
      return m ? { flower: m[1].trim(), qty: parseInt(m[2], 10) } : { flower: part, qty: null };
    }).filter(Boolean);
  }

  function deliveryPlanned(o){
    if (!o.delivery_on) return null;
    return new Date(o.delivery_on + 'T' + (o.delivery_time ? hhmm(o.delivery_time) : '23:59'));
  }
  function isLate(o){
    if (o.status === 'done' || o.status === 'cancelled') return false;
    var p = deliveryPlanned(o);
    return !!p && p < new Date();
  }
  function fmtDelivery(o){
    if (!o.delivery_on) return o.delivery_date || '';
    var today = isoDay(new Date());
    var label = o.delivery_on === today ? 'Сегодня'
      : o.delivery_on === isoDay(addDays(new Date(), 1)) ? 'Завтра'
      : fmtDate(parseDay(o.delivery_on));
    return label + (o.delivery_time ? ', ' + hhmm(o.delivery_time) : '');
  }

  /* Настоящее распознавание переписки идёт через Claude API (/api/parse-order),
     а не локальной эвристикой — см. onRecognize(). */
  async function parseOrder(text){
    var sessionRes = await sb.auth.getSession();
    var session = sessionRes.data && sessionRes.data.session;
    if (!session) throw new Error('Сессия истекла — войдите заново');
    var now = new Date();
    var res = await fetch('/api/parse-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
      body: JSON.stringify({
        text: text,
        now: isoDay(now) + ' (' + WEEKDAYS[now.getDay()] + '), ' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
        flowerNames: state.flowerNames
      })
    });
    if (!res.ok) {
      var errBody = await res.json().catch(function(){ return {}; });
      throw new Error(errBody.error || ('Сервер вернул ' + res.status));
    }
    var r = await res.json();
    return {
      bouquet: r.flowers || '',
      items: itemsToText(r.items),
      budget: r.budget != null ? String(r.budget) : '',
      date: r.deliveryDate || '',
      time: r.deliveryTime || '',
      dateText: r.deliveryText || '',
      address: r.address || '',
      client: r.clientName || '',
      phone: r.clientPhone || '',
      channel: r.channel === 'instagram' ? 'Instagram' : 'WhatsApp'
    };
  }

  function sortByDelivery(a, b){
    var ka = (a.delivery_on || '9999') + (hhmm(a.delivery_time) || '99');
    var kb = (b.delivery_on || '9999') + (hhmm(b.delivery_time) || '99');
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  }

  function renderBoard(){
    var board = document.getElementById('board');
    if (!board) return;
    var orders = state.orders;
    var day = state.boardFilter === 'today' ? isoDay(new Date())
      : state.boardFilter === 'tomorrow' ? isoDay(addDays(new Date(), 1)) : null;
    if (day) orders = orders.filter(function(o){ return o.delivery_on === day; });
    var cols = STATUS_ORDER.concat(state.showCancelled ? ['cancelled'] : []);
    board.innerHTML = cols.map(function(key){
      var st = STATUS[key];
      var cards = orders.filter(function(o){ return o.status === key; });
      var hidden = 0;
      if (key === 'done' || key === 'cancelled') {
        // завершённые — свежие сверху, остальные — по времени доставки
        if (!day && cards.length > DONE_LIMIT) { hidden = cards.length - DONE_LIMIT; cards = cards.slice(0, DONE_LIMIT); }
      } else {
        cards = cards.slice().sort(sortByDelivery);
      }
      return (
        '<div class="column" data-col="' + key + '" style="--col-accent:' + st.color + '">' +
          '<div class="column-head"><span class="col-dot"></span><h3>' + esc(st.title) + '</h3><span class="col-count">' + (cards.length + hidden) + '</span></div>' +
          '<div class="col-body">' +
            (cards.length ? cards.map(renderCard).join('') : '<p class="col-empty">Пусто</p>') +
            (hidden ? '<p class="col-empty">и ещё ' + hidden + ' — см. «Сегодня» / «Аналитика»</p>' : '') +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

        '<div class="kcard-top">' +
          '<p class="kcard-bouquet">' + esc(o.flowers || itemsToText(o.items) || 'не указано') + '</p>' +
          '<span class="channel-badge ' + channelClass + '">' + esc(o.channel) + '</span>' +
        '</div>' +
        '<p class="kcard-price">' + (o.budget ? money(o.budget) : 'не указано') + '</p>' +
        '<div class="kcard-meta">' +
          '<span class="' + (delivery ? 'filled' : 'muted') + '">' + esc(delivery || 'дата не указана') +
            (late ? ' <span class="late-badge">⚠ опаздывает</span>' : '') + '</span>' +
          '<span class="' + (o.address ? 'filled' : 'muted') + '">' + esc(o.address || 'адрес не указан') + '</span>' +
        '</div>' +

          '<span class="' + (o.client_name ? 'client-name' : 'muted') + '">' + esc(o.client_name || 'клиент не указан') + '</span>' +
          (o.client_phone ? '<a class="kcard-phone" href="tel:' + esc(o.client_phone.replace(/[^\d+]/g, '')) + '">' + esc(o.client_phone) + '</a>' : '') +

          (st.next ? '<button type="button" class="btn-step" data-move="' + o.id + '" data-to="' + st.next + '">' + esc(st.nextLabel) + '</button>' : '') +
          (o.status === 'cancelled' ? '<button type="button" class="btn-step" data-move="' + o.id + '" data-to="new">Вернуть в работу</button>' : '') +
          '<button type="button" class="btn-icon" data-edit="' + o.id + '" aria-label="Изменить заказ" title="Изменить">✎</button>' +
        '</div>' +
      '</article>'
    );

  async function onRecognize(){
    if (!state.chat.trim() || state.loading) return;
    state.loading = true;
    state.showForm = false;
    renderOrdersTab();
    try {
      var form = await parseOrder(state.chat);
      state.form = form;
      state.formSource = 'ai';
      state.showForm = true;
    } catch (err) {
      alert('Не удалось распознать заказ: ' + (err.message || err));
    } finally {
      state.loading = false;
      renderOrdersTab();
    }
  }

  async function onCreateOrder(){
    var payload = formToPayload(state.form);
    payload.status = 'new';
    var btn = document.getElementById('createOrderBtn');
    if (btn) btn.setAttribute('disabled', 'disabled');
    try {
      var res = await sb.from('orders').insert(payload);
      if (res.error) throw res.error;
      state.showForm = false;
      state.chat = '';
      state.form = emptyForm();
      renderOrdersTab();
    } catch (err) {
      if (btn) btn.removeAttribute('disabled');
      alert('Не удалось создать заказ: ' + (err.message || err));
    }
  }

  /* смена статуса: кнопки на карточке, перетаскивание и форма редактирования идут сюда */
  async function setStatus(orderId, status){
    var order = state.orders.find(function(o){ return o.id === orderId; });
    if (!order || order.status === status) return;
    var prevStatus = order.status;
    order.status = status;
    renderBoard();
    try {
      var res = await sb.from('orders').update({ status: status }).eq('id', orderId);
      if (res.error) throw res.error;
    } catch (err) {
      order.status = prevStatus;
      renderBoard();
      alert('Не удалось обновить статус заказа: ' + (err.message || err));
    }
  }

  panel.addEventListener('click', function(e){
    var move = e.target.closest('[data-move]');
    if (move) { setStatus(Number(move.getAttribute('data-move')), move.getAttribute('data-to')); return; }
    var edit = e.target.closest('[data-edit]');
    if (edit) openOrderDialog(Number(edit.getAttribute('data-edit')));
  });

  /* ---------------- edit / cancel / delete order ---------------- */
  function openOrderDialog(orderId){
    var order = state.orders.find(function(o){ return o.id === orderId; });
    if (!order) return;
    var f = orderToForm(order);
    var statusKeys = STATUS_ORDER.concat(['cancelled']);
    dialog.innerHTML =
      '<form method="dialog" class="dialog-body" id="editForm">' +
        '<div class="section-head"><h2>Заказ №' + order.id + '</h2>' +
          '<span class="hint">создан ' + esc(fmtDate(new Date(order.created_at))) + '</span></div>' +
        orderFields(f, 'e-') +
        '<label class="field status-field">Статус<select id="e-status">' +
          statusKeys.map(function(k){ return '<option value="' + k + '"' + (order.status === k ? ' selected' : '') + '>' + STATUS[k].title + '</option>'; }).join('') +
        '</select></label>' +
        '<div class="form-actions dialog-actions">' +
          '<button type="button" id="saveOrderBtn" class="btn-primary">Сохранить</button>' +
          '<button type="button" id="closeDialogBtn" class="btn-cancel">Закрыть</button>' +
          '<span class="spacer"></span>' +
          (order.status !== 'cancelled' ? '<button type="button" id="cancelOrderBtn" class="btn-cancel">Отменить заказ</button>' : '') +
          '<button type="button" id="deleteOrderBtn" class="btn-danger">Удалить</button>' +
        '</div>' +
      '</form>';
    bindOrderFields(f, 'e-');
    // Enter в поле не должен закрывать диалог без сохранения
    document.getElementById('editForm').addEventListener('submit', function(e){ e.preventDefault(); });
    document.getElementById('closeDialogBtn').addEventListener('click', function(){ dialog.close(); });
    document.getElementById('saveOrderBtn').addEventListener('click', async function(){
      var payload = formToPayload(f);
      payload.status = document.getElementById('e-status').value;
      await saveOrder(order.id, payload);
    });
    var cancelBtn = document.getElementById('cancelOrderBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', function(){ dialog.close(); setStatus(order.id, 'cancelled'); });
    var delBtn = document.getElementById('deleteOrderBtn');
    delBtn.addEventListener('click', async function(){
      // удаление в два нажатия, без системного confirm()
      if (!delBtn.classList.contains('armed')) {
        delBtn.classList.add('armed');
        delBtn.textContent = 'Точно удалить?';
        return;
      }
      delBtn.setAttribute('disabled', 'disabled');
      var res = await sb.from('orders').delete().eq('id', order.id);
      if (res.error) { delBtn.removeAttribute('disabled'); alert('Не удалось удалить заказ: ' + res.error.message); return; }
      state.orders = state.orders.filter(function(o){ return o.id !== order.id; });
      dialog.close();
      renderBoard();
    });
    dialog.showModal();
  }

  async function saveOrder(orderId, payload){
    var btn = document.getElementById('saveOrderBtn');
    btn.setAttribute('disabled', 'disabled');
    var res = await sb.from('orders').update(payload).eq('id', orderId).select().single();
    if (res.error) { btn.removeAttribute('disabled'); alert('Не удалось сохранить заказ: ' + res.error.message); return; }
    state.orders = state.orders.map(function(o){ return o.id === orderId ? res.data : o; });
    dialog.close();
    renderBoard();
  }

  /* drag & drop (на компьютере), delegated on the whole panel since #board is rebuilt often */

  });

    var col = e.target.closest('[data-col]');
    if (!col) return;
    e.preventDefault();
    col.classList.add('drag-over');
  });
  panel.addEventListener('dragleave', function(e){
    var col = e.target.closest('[data-col]');
    if (col) col.classList.remove('drag-over');
  });
  panel.addEventListener('drop', function(e){
    var col = e.target.closest('[data-col]');

  async function loadClients(){
    try {
      var results = await Promise.all([
        sb.from('clients').select('*').order('created_at', { ascending: false }),
        sb.from('orders').select('client_id, budget, status, created_at')
      ]);
      if (results[0].error) throw results[0].error;
      if (results[1].error) throw results[1].error;
      var agg = {};
      (results[1].data || []).forEach(function(o){
        if (!o.client_id || o.status === 'cancelled') return;
        var a = agg[o.client_id] || (agg[o.client_id] = { count: 0, sum: 0, last: null });
        a.count++;
        a.sum += o.budget || 0;
        if (!a.last || o.created_at > a.last) a.last = o.created_at;
      });

  var PERIODS = [[7,'7 дней'],[30,'30 дней'],[90,'90 дней']];
  var WEEK_ROWS = [['Пн',1],['Вт',2],['Ср',3],['Чт',4],['Пт',5],['Сб',6],['Вс',0]];
  var STAGES = [['new','build','Принят → в сборке'],['build','courier','Сборка → курьер'],['courier','done','Курьер → доставлен']];
  var LATE_GRACE_MIN = 15;

  async function loadAnalytics(){
    var now = new Date();
    var startDay = addDays(new Date(now.getFullYear(), now.getMonth(), now.getDate()), -(state.period - 1));
    var sinceISO = startDay.toISOString();
    var results = await Promise.all([
      sb.from('orders').select('id, budget, status, channel, client_id, client_name, items, delivery_on, delivery_time, created_at').limit(10000),
      sb.from('order_status_history').select('order_id, status, changed_at').gte('changed_at', addDays(startDay, -14).toISOString()).limit(50000),
      sb.from('write_offs').select('flower_name, quantity, unit_cost, created_at').gte('created_at', sinceISO),
      sb.from('inventory').select('id', { count: 'exact', head: true }).lt('quantity', 10),
      sb.from('clients').select('id, name')
    ]);
    results.forEach(function(r){ if (r.error) throw r.error; });
    if (state.tab !== 'summary') return;
    var a = computeAnalytics(results[0].data || [], results[1].data || [], results[2].data || [], startDay, now);
    a.lowStock = results[3].count || 0;
    var names = {};
    (results[4].data || []).forEach(function(c){ names[c.id] = c.name; });
    a.topClients.forEach(function(c){ c.name = names[c.id] || c.fallbackName || 'Без имени'; });
    renderAnalytics(a);
  }

  function computeAnalytics(allOrders, history, writeoffs, startDay, now){
    var startKey = isoDay(startDay);
    var hist = {};
    history.forEach(function(h){
      var byStatus = hist[h.order_id] || (hist[h.order_id] = {});
      if (!byStatus[h.status] || h.changed_at < byStatus[h.status]) byStatus[h.status] = h.changed_at;
    });

    // заказ относится к периоду по дате создания; выручка — по дню доставки
    var inPeriod = allOrders.filter(function(o){ return new Date(o.created_at) >= startDay; });
    var active = inPeriod.filter(function(o){ return o.status !== 'cancelled'; });
    var cancelled = inPeriod.length - active.length;

    var days = [];
    for (var d = new Date(startDay); d <= now; d = addDays(d, 1)) days.push({ key: isoDay(d), date: new Date(d), revenue: 0, orders: 0 });
    var dayIndex = {};
    days.forEach(function(x, i){ dayIndex[x.key] = i; });

    var delivered = allOrders.filter(function(o){ return o.status === 'done'; });
    var revenue = 0, deliveredCount = 0;
    delivered.forEach(function(o){
      var doneAt = hist[o.id] && hist[o.id].done;
      var key = o.delivery_on || (doneAt ? isoDay(new Date(doneAt)) : isoDay(new Date(o.created_at)));
      if (key < startKey || dayIndex[key] == null) return;
      days[dayIndex[key]].revenue += o.budget || 0;
      days[dayIndex[key]].orders++;
      revenue += o.budget || 0;
      deliveredCount++;
    });

    // каналы
    var channels = ['WhatsApp','Instagram'].map(function(name){
      var list = active.filter(function(o){ return (o.channel || 'WhatsApp') === name; });
      var sum = list.reduce(function(s, o){ return s + (o.budget || 0); }, 0);
      return { name: name, orders: list.length, revenue: sum, avg: list.length ? sum / list.length : 0 };
    });

    // клиенты: повторный — у кого за всё время 2+ неотменённых заказа
    var totalByClient = {};
    allOrders.forEach(function(o){
      if (o.client_id && o.status !== 'cancelled') totalByClient[o.client_id] = (totalByClient[o.client_id] || 0) + 1;
    });
    var periodClients = {};
    active.forEach(function(o){
      if (!o.client_id) return;
      var c = periodClients[o.client_id] || (periodClients[o.client_id] = { id: o.client_id, orders: 0, sum: 0, fallbackName: o.client_name });
      c.orders++;
      c.sum += o.budget || 0;
    });
    var clientIds = Object.keys(periodClients);
    var repeat = clientIds.filter(function(id){ return totalByClient[id] >= 2; }).length;
    var topClients = clientIds.map(function(id){ return periodClients[id]; })
      .sort(function(x, y){ return y.sum - x.sum || y.orders - x.orders; }).slice(0, 10);

    // когда приходят заказы: день недели × час
    var heat = {};
    var heatMax = 0;
    inPeriod.forEach(function(o){
      var t = new Date(o.created_at);
      var k = t.getDay() + '-' + t.getHours();
      heat[k] = (heat[k] || 0) + 1;
      if (heat[k] > heatMax) heatMax = heat[k];
    });

    // скорость по этапам (медиана) и опоздания
    var stages = STAGES.map(function(s){
      var mins = [];
      inPeriod.forEach(function(o){
        var h = hist[o.id];
        if (!h || !h[s[0]] || !h[s[1]]) return;
        var m = (new Date(h[s[1]]) - new Date(h[s[0]])) / 60000;
        if (m >= 0) mins.push(m);
      });
      mins.sort(function(x, y){ return x - y; });
      return { label: s[2], median: mins.length ? mins[Math.floor(mins.length / 2)] : null, n: mins.length };
    });
    var lateChecked = 0, lateCount = 0;
    inPeriod.forEach(function(o){
      var doneAt = hist[o.id] && hist[o.id].done;
      var planned = o.delivery_time ? deliveryPlanned(o) : null;
      if (o.status !== 'done' || !doneAt || !planned) return;
      lateChecked++;
      if (new Date(doneAt) - planned > LATE_GRACE_MIN * 60000) lateCount++;
    });

    // популярные цветы и потери
    var flowers = {};
    function fl(name){
      var key = name.trim().toLowerCase();
      return flowers[key] || (flowers[key] = { name: name.trim(), sold: 0, wasted: 0, loss: 0 });
    }
    active.forEach(function(o){
      (o.items || []).forEach(function(it){ if (it && it.flower) fl(it.flower).sold += it.qty || 0; });
    });
    var wasteLoss = 0;
    writeoffs.forEach(function(w){
      if (!w.flower_name) return;
      var f = fl(w.flower_name);
      f.wasted += w.quantity || 0;
      f.loss += (w.quantity || 0) * (w.unit_cost || 0);
      wasteLoss += (w.quantity || 0) * (w.unit_cost || 0);
    });
    var flowerList = Object.keys(flowers).map(function(k){ return flowers[k]; });
    var topFlowers = flowerList.filter(function(f){ return f.sold > 0; })
      .sort(function(x, y){ return y.sold - x.sold; }).slice(0, 10);
    var waste = flowerList.filter(function(f){ return f.wasted > 0; })
      .sort(function(x, y){ return y.loss - x.loss || y.wasted - x.wasted; }).slice(0, 10);

    return {
      revenue: revenue, deliveredCount: deliveredCount, ordersCount: active.length,
      avgCheck: deliveredCount ? revenue / deliveredCount : 0,
      cancelled: cancelled, cancelRate: pct(cancelled, inPeriod.length),
      repeat: repeat, clientsCount: clientIds.length,
      days: days, channels: channels, topClients: topClients,
      heat: heat, heatMax: heatMax,
      stages: stages, lateChecked: lateChecked, lateCount: lateCount,
      topFlowers: topFlowers, waste: waste, wasteLoss: wasteLoss
    };
  }

  function revenueChart(days){
    var W = Math.max(300, Math.round(panel.clientWidth - 48)), H = 240, padL = 56, padR = 8, padT = 16, padB = 28;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var max = Math.max.apply(null, days.map(function(d){ return d.revenue; }).concat([1]));
    var step = Math.pow(10, Math.floor(Math.log10(max)));
    var top = Math.ceil(max / step) * step;
    var slot = plotW / days.length;
    var bw = Math.max(2, Math.min(24, slot - 2));
    var maxIdx = -1, maxVal = 0;
    days.forEach(function(d, i){ if (d.revenue > maxVal) { maxVal = d.revenue; maxIdx = i; } });
    var labelEvery = Math.ceil(days.length / Math.max(2, Math.floor(plotW / 64)));  // ~64px на подпись даты
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart-svg" role="img" aria-label="Выручка по дням">';
    [0, 0.5, 1].forEach(function(t){
      var y = padT + plotH - t * plotH;
      svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '" class="grid"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" class="tick" text-anchor="end">' + esc(compact(top * t)) + '</text>';
    });
    days.forEach(function(d, i){
      var x = padL + i * slot + (slot - bw) / 2;
      var h = d.revenue / top * plotH;
      var y = padT + plotH - h;
      var r = Math.min(4, bw / 2, h);
      if (h > 0) {
        svg += '<path class="bar" d="M' + x + ',' + (padT + plotH) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
          'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y + ' ' + (x + bw) + ',' + (y + r) + 'V' + (padT + plotH) + 'Z"/>';
      }
      svg += '<rect class="hit" x="' + (padL + i * slot) + '" y="' + padT + '" width="' + slot + '" height="' + plotH + '" data-tip="' +
        esc(fmtDate(d.date) + ': ' + money(d.revenue) + ' · заказов: ' + d.orders) + '"/>';
      if (i % labelEvery === 0) {
        svg += '<text x="' + (padL + i * slot + slot / 2) + '" y="' + (H - 8) + '" class="tick" text-anchor="middle">' + esc(fmtDate(d.date)) + '</text>';
      }
    });
    if (maxIdx >= 0) {
      var mx = padL + maxIdx * slot + slot / 2;
      var my = padT + plotH - maxVal / top * plotH - 6;
      svg += '<text x="' + Math.min(Math.max(mx, padL + 30), W - 40) + '" y="' + Math.max(my, 12) + '" class="peak" text-anchor="middle">' + esc(compact(maxVal)) + '</text>';
    }
    svg += '</svg>';
    var table = '<details class="chart-table"><summary>Таблица</summary><div class="table-wrap"><table><thead><tr><th>День</th><th class="num">Заказов</th><th class="num">Выручка</th></tr></thead><tbody>' +
      days.map(function(d){ return '<tr><td>' + esc(fmtDate(d.date)) + '</td><td class="num">' + d.orders + '</td><td class="num">' + money(d.revenue) + '</td></tr>'; }).join('') +
      '</tbody></table></div></details>';
    return '<div class="chart-box">' + svg + '</div>' + table;
  }
  function compact(n){
    if (n >= 1e6) return (Math.round(n / 1e5) / 10) + ' млн';
    if (n >= 1e3) return (Math.round(n / 100) / 10) + ' тыс';
    return String(Math.round(n));
  }

  function heatmap(heat, max){
    var steps = [0, 18, 38, 60, 82];
    function level(v){ return v ? Math.min(4, Math.ceil(v / max * 4)) : 0; }
    var html = '<div class="heat-wrap"><div class="heat" role="table" aria-label="Заказы по дням недели и часам">';
    html += '<span></span>';
    for (var h = 0; h < 24; h++) html += '<span class="heat-hour">' + (h % 3 === 0 ? h : '') + '</span>';
    WEEK_ROWS.forEach(function(r){
      html += '<span class="heat-day">' + r[0] + '</span>';
      for (var h2 = 0; h2 < 24; h2++) {
        var v = heat[r[1] + '-' + h2] || 0;
        html += '<span class="heat-cell" style="--lvl:' + steps[level(v)] + '%" data-tip="' + esc(r[0] + ', ' + h2 + ':00–' + (h2 + 1) + ':00 — заказов: ' + v) + '" tabindex="-1"></span>';
      }
    });
    html += '</div><div class="heat-legend"><span>меньше</span>' +
      steps.map(function(s){ return '<span class="heat-cell" style="--lvl:' + s + '%"></span>'; }).join('') + '<span>больше</span></div></div>';
    return html;
  }

  function renderAnalytics(a){
    var tiles =
      statTile('Выручка', money(a.revenue), 'доставленные заказы за период') +
      statTile('Средний чек', a.deliveredCount ? money(a.avgCheck) : '—', 'по доставленным заказам') +
      statTile('Заказов', String(a.ordersCount), 'без отменённых · отмен: ' + a.cancelRate) +
      statTile('Повторные клиенты', pct(a.repeat, a.clientsCount), a.repeat + ' из ' + a.clientsCount + ' клиентов периода') +
      statTile('Опоздания', a.lateChecked ? pct(a.lateCount, a.lateChecked) : '—', a.lateChecked ? a.lateCount + ' из ' + a.lateChecked + ' с указанным временем' : 'нет доставок с указанным временем') +
      statTile('Потери на списаниях', money(a.wasteLoss), 'по закупочной цене · позиций с низким остатком: ' + a.lowStock);

    var channelTable = '<div class="table-wrap"><table class="compare"><thead><tr><th>Канал</th><th class="num">Заказов</th><th class="num">Сумма</th><th class="num">Средний чек</th></tr></thead><tbody>' +
      a.channels.map(function(c){
        return '<tr><td><span class="channel-badge ' + (c.name === 'WhatsApp' ? 'wa' : 'ig') + '">' + c.name + '</span></td>' +
          '<td class="num">' + c.orders + '</td><td class="num">' + money(c.revenue) + '</td><td class="num">' + (c.orders ? money(c.avg) : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      barList(a.channels.map(function(c){ return { label: c.name, value: c.revenue, extra: c.orders + ' заказов' }; }), money);

    var hasHistory = a.stages.some(function(s){ return s.n > 0; });

    panel.innerHTML =
      '<div id="analytics" class="panel-stack">' +
        '<div class="board-toolbar">' +
          '<div class="pill-group" role="group" aria-label="Период">' +
            PERIODS.map(function(p){ return '<button type="button" class="pill' + (state.period === p[0] ? ' active' : '') + '" data-period="' + p[0] + '">' + p[1] + '</button>'; }).join('') +
          '</div>' +
        '</div>' +
        '<section class="stat-grid">' + tiles + '</section>' +
        '<div class="chart-grid">' +
          chartCard('Выручка по дням', 'доставленные заказы, ₸', a.revenue ? revenueChart(a.days) : emptyNote('Пока нет доставленных заказов за период'), true) +
          chartCard('WhatsApp или Instagram', 'неотменённые заказы за период', channelTable) +
          chartCard('Лучшие клиенты', 'по сумме заказов за период',
            a.topClients.length ? barList(a.topClients.map(function(c){ return { label: c.name, value: c.sum, extra: c.orders + ' заказ(ов)' }; }), money) : emptyNote('Нет заказов с телефоном клиента')) +
          chartCard('Когда приходят заказы', 'день недели × час создания заказа', a.heatMax ? heatmap(a.heat, a.heatMax) : emptyNote('Нет заказов за период'), true) +
          chartCard('Скорость по этапам', 'медиана времени между статусами',
            hasHistory ? barList(a.stages.filter(function(s){ return s.n; }).map(function(s){ return { label: s.label, value: s.median, extra: 'заказов: ' + s.n }; }), fmtDuration)
              : emptyNote('Появится, когда заказы пройдут этапы после обновления')) +
          chartCard('Популярные цветы', 'штук в заказах за период',
            a.topFlowers.length ? barList(a.topFlowers.map(function(f){ return { label: f.name, value: f.sold }; }), function(v){ return num(v) + ' шт.'; })
              : emptyNote('Появится, когда в заказах будут позиции (ИИ заполняет их сам)')) +
          chartCard('Потери на списаниях', 'по цветам за период',
            a.waste.length ? wasteTable(a.waste) : emptyNote('Списаний за период нет'), true) +
        '</div>' +
      '</div>';
  }

  function wasteTable(rows){
    return '<div class="table-wrap"><table><thead><tr><th>Цветок</th><th class="num">Списано, шт.</th><th class="num">Продано, шт.</th><th class="num">Доля потерь</th><th class="num">Потери</th></tr></thead><tbody>' +
      rows.map(function(f){
        return '<tr><td>' + esc(f.name) + '</td><td class="num">' + num(f.wasted) + '</td><td class="num">' + num(f.sold) + '</td>' +
          '<td class="num">' + pct(f.wasted, f.wasted + f.sold) + '</td><td class="num">' + (f.loss ? money(f.loss) : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="hint" style="margin-top:10px">Доля потерь = списано / (списано + продано). Потери в ₸ считаются, если на «Складе» указана закупочная цена.</p>';
  }

  /* общий тултип для графиков: наведение мышью и фокус с клавиатуры */
  var tip = document.getElementById('chartTip');
  function showTip(target, x, y){
    tip.textContent = target.getAttribute('data-tip');
    tip.hidden = false;
    var r = tip.getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - r.width - 8, Math.max(8, x - r.width / 2)) + 'px';
    tip.style.top = Math.max(8, y - r.height - 12) + 'px';
  }
  panel.addEventListener('mousemove', function(e){
    var t = e.target.closest('[data-tip]');
    if (!t) { tip.hidden = true; return; }
    showTip(t, e.clientX, e.clientY);
  });
  panel.addEventListener('mouseleave', function(){ tip.hidden = true; });
  panel.addEventListener('focusin', function(e){
    var t = e.target.closest('[data-tip]');
    if (!t) return;
    var r = t.getBoundingClientRect();
    showTip(t, r.left + r.width / 2, r.top);
  });
  panel.addEventListener('focusout', function(){ tip.hidden = true; });


  /* ---------------- auth ---------------- */
  var userBar = document.getElementById('userBar');
  var appStarted = false;

  function renderLogin(errorMsg){
    appStarted = false;
    userBar.hidden = true;
    tabsEl.innerHTML = '';
    panel.innerHTML =
      '<section class="card-surface login-card">' +
        '<h2>Вход</h2>' +
        '<p class="hint">Доступ только для сотрудников магазина.</p>' +
        '<form id="loginForm">' +
          '<label class="field">Email<input id="loginEmail" type="email" autocomplete="username" required></label>' +
          '<label class="field">Пароль<input id="loginPassword" type="password" autocomplete="current-password" required></label>' +
          (errorMsg ? '<p class="login-error">' + esc(errorMsg) + '</p>' : '') +
          '<button type="submit" id="loginBtn" class="btn-primary">Войти</button>' +
        '</form>' +
      '</section>';
    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Входим…';
      var res = await sb.auth.signInWithPassword({
        email: document.getElementById('loginEmail').value.trim(),
        password: document.getElementById('loginPassword').value
      });
      if (res.error) renderLogin('Неверный email или пароль');
    });
  }

  function startApp(session){
    document.getElementById('userEmail').textContent = session.user.email || '';
    userBar.hidden = false;
    if (appStarted) return;
    appStarted = true;
    renderTabs();
    renderPanel();
  }

  document.getElementById('logoutBtn').addEventListener('click', function(){
    sb.auth.signOut();
  });

  /* ---------------- boot ---------------- */
  async function boot(){
    try {
      var cfgRes = await fetch('/api/config');
      var cfg = await cfgRes.json();
      if (!cfg.url || !cfg.anonKey) {
        throw new Error('Supabase не настроен: заполните SUPABASE_URL и SUPABASE_ANON_KEY (.env.local локально, Environment Variables на Vercel в проде)');
      }
      sb = window.supabase.createClient(cfg.url, cfg.anonKey);
    } catch (err) {
      panel.innerHTML = '<section class="card-surface"><h2>Ошибка подключения к Supabase</h2><p class="hint">' + esc(err.message || String(err)) + '</p></section>';
      return;
    }
    // setTimeout: supabase-js не рекомендует вызывать sb.* прямо внутри колбэка (возможен deadlock)
    sb.auth.onAuthStateChange(function(event, session){
      setTimeout(function(){
        if (session) startApp(session);
        else renderLogin();
      }, 0);
    });
  }
  boot();
})();
</script>
</body>
